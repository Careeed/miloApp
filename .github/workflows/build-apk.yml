name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installa dipendenze
        run: npm install

      - name: Prepara la cartella www
        run: |
          mkdir -p www
          if [ ! -f www/index.html ]; then
            F=$(find . -name index.html -not -path './node_modules/*' -not -path './android/*' -not -path './www/*' | head -1)
            if [ -z "$F" ]; then echo "ERRORE: index.html non trovato nel repository"; exit 1; fi
            echo "Uso $F"
            cp "$F" www/index.html
          fi

      - name: Crea progetto Android
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#cfe8f7' --iconBackgroundColorDark '#cfe8f7' || echo "icone non generate"
          npx cap sync android

      - name: Compila APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Salva APK
        uses: actions/upload-artifact@v4
        with:
          name: milo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
